[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abverdict"
version = "0.1.0"
description = "Did my A/B test actually win? A statistically honest, plain-English verdict for marketers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["ab-testing", "experimentation", "marketing", "statistics", "cro"]

[project.scripts]
abverdict = "abverdict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abverdict = ["web/*", "web/fonts/*", "web/img/*"]
